<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Vehicle Damage Assessment: multimodal AI for diagnosis and repair-cost estimation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#10304a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>
  <circle cx="950" cy="150" r="260" fill="url(#glow)"/>

  <!-- car silhouette with damage markers -->
  <g fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M770 196 L770 170 Q770 152 792 148 L836 142 Q868 104 916 96 L1004 96 Q1048 99 1074 134 L1118 142 Q1140 147 1140 170 L1140 196 Z"/>
    <path d="M868 142 L890 112 L956 108 L956 142 Z" stroke-opacity="0.55"/>
    <path d="M966 142 L966 108 L1004 108 Q1030 112 1046 142 Z" stroke-opacity="0.55"/>
  </g>
  <g fill="#0c1a2e" stroke="#22d3ee" stroke-width="2.5">
    <circle cx="840" cy="198" r="22"/>
    <circle cx="1072" cy="198" r="22"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.9"><circle cx="840" cy="198" r="6"/><circle cx="1072" cy="198" r="6"/></g>
  <!-- scan frame -->
  <g fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 6" stroke-opacity="0.85">
    <rect x="780" y="84" width="170" height="124" rx="10"/>
  </g>
  <g>
    <circle cx="800" cy="160" r="12" fill="#f59e0b" fill-opacity="0.25"/><circle cx="800" cy="160" r="5" fill="#f59e0b"/>
    <circle cx="912" cy="128" r="12" fill="#f59e0b" fill-opacity="0.25"/><circle cx="912" cy="128" r="5" fill="#f59e0b"/>
    <circle cx="1112" cy="150" r="12" fill="#2dd4bf" fill-opacity="0.25"/><circle cx="1112" cy="150" r="5" fill="#2dd4bf"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="72" font-size="13" letter-spacing="3" fill="#67e8f9" font-weight="600">AUTOMOTIVE  ·  COMPUTER VISION  ·  MULTIMODAL AI</text>
    <text x="64" y="146" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Vehicle Damage Assessment</text>
    <text x="64" y="192" font-size="21" fill="#cfe3ee">Multimodal AI for diagnosis and repair-cost estimation</text>
    <text x="64" y="226" font-size="16" fill="#8fa8ba">From photos, video, audio and text to a decision-ready report.</text>

    <g>
      <rect x="64" y="274" width="330" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#27506b"/>
      <rect x="64" y="274" width="5" height="76" rx="2.5" fill="#22d3ee"/>
      <text x="92" y="306" font-size="19" font-weight="700" fill="#ffffff">Collect</text>
      <text x="92" y="331" font-size="13.5" fill="#9fb8c9">Images · video · audio · text</text>

      <rect x="435" y="274" width="330" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#27506b"/>
      <rect x="435" y="274" width="5" height="76" rx="2.5" fill="#2dd4bf"/>
      <text x="463" y="306" font-size="19" font-weight="700" fill="#ffffff">Diagnose</text>
      <text x="463" y="331" font-size="13.5" fill="#9fb8c9">Dynamic questionnaire · LLM analysis</text>

      <rect x="806" y="274" width="330" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#27506b"/>
      <rect x="806" y="274" width="5" height="76" rx="2.5" fill="#f59e0b"/>
      <text x="834" y="306" font-size="19" font-weight="700" fill="#ffffff">Estimate</text>
      <text x="834" y="331" font-size="13.5" fill="#9fb8c9">Repair vs. replace · costs · report</text>
    </g>
  </g>

  <g stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M406 312 L423 312 M417 305 L424 312 L417 319"/>
    <path d="M777 312 L794 312 M788 305 L795 312 L788 319"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
